version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/xkcd_scraper"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      pip:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      pip-major:
        patterns: ["*"]
        update-types: ["major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]
